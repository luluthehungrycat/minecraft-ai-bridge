# ── Minecraft AI Bridge Configuration ──────────────────────────────────

minecraft:
  host: localhost
  # RCON (optional fallback — MCPQ is the primary interface)
  rcon_port: 25575
  rcon_password: "affensalat"
  player_name: "AIBot"

# MCPQ plugin connection (replaces pyCraft bot for player control)
mc_api:
  host: localhost
  port: 1789
  player_name: "AIBot"

llm:
  # Provider: "openai", "anthropic", "ollama", "openrouter", "opencode_server"
  provider: openrouter
  # Model identifiers per provider:
  #   openai         → gpt-4o, gpt-4o-mini, gpt-4-turbo
  #   anthropic      → claude-sonnet-4-20250514, claude-haiku-3-5
  #   ollama         → llama3, mixtral, etc.
  #   openrouter     → openai/gpt-4o, anthropic/claude-sonnet-4, etc.
  #   opencode_server → big-pickle, or provider/model format
  model: openai/gpt-oss-20b
  temperature: 0.7
  max_tokens: 4096

bridge:
  max_iterations: 100
  cycle_delay: 1.0
  memory_window: 20
  verbose: true
  event_journal_path: data/safety-events.sqlite3

# Optional local AuthzService gate for the built-in controller. Keep the
# bearer tokens in environment variables, never in this YAML file.
authz:
  enabled: false
  database_path: data/authz.sqlite3
  steve_id: ""
  session_lease_seconds: 3600
  # Safety-only operation after losing controller authority ends after this
  # many seconds unless an authorized in-game !stop arrives first.
  suspended_shutdown_seconds: 300

# Chat identity commands are disabled unless the server authenticates accounts.
chat_control:
  server_online_mode: false
  allowed_uuids: []
  allowed_names: []

goals:
  default: "Explore the world and gather resources"
  max_depth: 5
