name: CI

on:
  push:
    branches: [master, main]
  # Every base branch, so stacked PRs are verified too.
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check minecraft_ai_bridge/ tests/

      - name: Check formatting with ruff
        run: ruff format --check minecraft_ai_bridge/ tests/

      - name: Type check with mypy
        run: mypy minecraft_ai_bridge/ --ignore-missing-imports

      - name: Check import sorting
        run: ruff check --select I minecraft_ai_bridge/ tests/


  bot-plugin:
    name: Bot Plugin (pinned Paper 26.2 build 123)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build bot plugin against pinned Paper 26.2 build 123
        working-directory: bot-plugin
        run: ./gradlew --no-daemon clean build

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgrpc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (no integration tests - require Minecraft server)
        run: pytest tests/ -k "not integration" -v --tb=short --timeout=30

  integration:
    name: Integration Tests (opt-in)
    runs-on: ubuntu-latest
    # This job provisions the pinned Paper 26.2 build 123 stack from docker-compose.yml.
    # Set RUN_LIVE_INTEGRATION=true only when provider-backed tests are desired.
    if: ${{ vars.RUN_LIVE_INTEGRATION == 'true' }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MC_API_HOST: localhost
      MC_API_PORT: "1789"
      MC_API_PLAYER_NAME: AIBot
    steps:
      - uses: actions/checkout@v4

      - name: Check integration prerequisites
        shell: bash
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::error::OPENROUTER_API_KEY is required when RUN_LIVE_INTEGRATION=true"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgrpc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare pinned Paper server and plugins
        run: ./scripts/download-plugins.sh

      - name: Start pinned Paper server
        run: docker compose up -d --wait minecraft

      - name: Run integration tests
        run: pytest tests/test_integration.py tests/test_mcp_integration.py -v --tb=short --timeout=120

      - name: Stop Paper server
        if: ${{ always() }}
        run: docker compose down -v
